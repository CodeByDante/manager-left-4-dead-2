name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main, master, desktop-only]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2-Mod-Manager-Windows
          path: release/*.exe
